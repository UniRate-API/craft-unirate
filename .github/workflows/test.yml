name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - name: Lint PHP sources
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install dependencies
        # Craft CMS is a host-platform require; we only unit-test the dep-free
        # client, so platform ext checks for the full Craft tree are skipped.
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs
      - name: Audit shipped dependency closure
        run: composer audit --no-dev --abandoned=ignore
      - name: Run mock test suite
        run: vendor/bin/phpunit --testsuite mock
